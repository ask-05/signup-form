<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/styles/styles.css" />
</head>
<body>
    <main class="signup-page">
        <aside class="signup-page__image">
            <img class="side-image" src="assets/images/pexels-jean-daniel-31737021.jpg">
            <div class="odin-logo__bg">
                <img class="odin-logo" src="assets/images/odin-logo.png">
                <p>ODIN</p>
            </div>
            <div class="signup-image__attribution">Photo by <a href="https://www.pexels.com/@jean-daniel/">Jean-Daniel Francoeur</a> from <a href="https://www.pexels.com/photo/serene-rocky-coastline-with-calm-waters-31737021/">Pexels</a></div>
        </aside>
        <section class="signup-page__form">
            <header class="signup-form__header">
                <h1>Sign up for our nature newsletter!</h1>
                <p>This isn't a real service! This is a test sign up form.</p>
            </header>
            <form class="signup-form__fields">
                <div class="signup-form__row">
                    <div>
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>
                <div class="signup-form__row">
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="phone-number">Phone Number</label>
                        <input type="text" id="phone-number" name="phone-number" minlength="9" maxlength="12" required>
                    </div>
                </div>
                <div class="signup-form__row">
                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*_=+-]).{8,12}$" required>
                    </div>
                    <div>
                        <label for="confirm-password">Confirm Password</label>
                        <input type="confirm-password" id="confirm-password" name="confirm-password" minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*_=+-]).{8,12}$" required>
                    </div>
                </div>
                <div class="signup-form__row">
                    <button type="submit" class="submit-button">Sign me up!</button>
                </div>
            </form>
            <footer class="signup-form__footer">
                <p>Already have an account? <span class="signup-footer__login">Login</span></p>
            </footer>
        </section>
    </main>
</body>
</html>
